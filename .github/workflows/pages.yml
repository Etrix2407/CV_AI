# Construit les deux versions du CV et les publie ensemble sur GitHub Pages
# à chaque push sur main, ou manuellement depuis l'onglet Actions :
#   SitePersoAngular -> /<dépôt>/        SitePersoReact -> /<dépôt>/react/

name: Publier le CV sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un déploiement en cours n'est pas annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            SitePersoAngular/package-lock.json
            SitePersoReact/package-lock.json

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Le site est servi sous /<dépôt>/ : base_path fournit ce préfixe.
      - name: Angular — installer, tester, construire
        working-directory: SitePersoAngular
        run: |
          npm ci
          npx ng test --watch=false
          npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: React — installer, tester, construire
        working-directory: SitePersoReact
        run: |
          npm ci
          npm test -- --run
          npm run build -- --base "${{ steps.pages.outputs.base_path }}/react/"

      - name: Assembler le site
        run: |
          mkdir _site
          cp -r SitePersoAngular/dist/SitePersoAngular/browser/. _site/
          cp -r SitePersoReact/dist _site/react

      - name: Préparer le site à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
