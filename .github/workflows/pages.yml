# Construit l'application Angular (SitePersoAngular/) et la publie sur GitHub Pages
# à chaque push sur main, ou manuellement depuis l'onglet Actions.

name: Publier le CV sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un déploiement en cours n'est pas annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SitePersoAngular
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SitePersoAngular/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npx ng test --watch=false

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Le site est servi sous /<dépôt>/ : base_path fournit ce préfixe.
      - name: Construire le site
        run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Préparer le site à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: SitePersoAngular/dist/SitePersoAngular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
