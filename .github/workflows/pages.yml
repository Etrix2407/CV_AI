# Génère le CV (python build.py) et le publie sur GitHub Pages
# à chaque push sur main, ou manuellement depuis l'onglet Actions.

name: Publier le CV sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un déploiement en cours n'est pas annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le site
        run: python build.py

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
